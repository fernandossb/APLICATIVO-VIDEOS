<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CosturaFlow | Ficha técnica online</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <main class="workspace">
        <header class="topbar">
          <div class="brand topbar-brand">
            <div class="brand-mark" aria-hidden="true">
              <svg viewBox="0 0 24 24" role="img">
                <path d="M5 4h5l1.3 2h6.2A2.5 2.5 0 0 1 20 8.5v7A4.5 4.5 0 0 1 15.5 20h-7A4.5 4.5 0 0 1 4 15.5V5a1 1 0 0 1 1-1Z" />
                <path d="M8 9h8M8 13h7M8 17h4" />
              </svg>
            </div>
            <div>
              <strong>CosturaFlow</strong>
              <span>Ficha técnica online</span>
            </div>
          </div>

          <div class="folder-summary">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 6.5A2.5 2.5 0 0 1 5.5 4H10l2 2h6.5A2.5 2.5 0 0 1 21 8.5v7A4.5 4.5 0 0 1 16.5 20h-11A2.5 2.5 0 0 1 3 17.5v-11Z" />
            </svg>
            <div>
              <span>Pasta atual</span>
              <strong id="folderStatus">Carregando...</strong>
            </div>
          </div>

          <div class="topbar-tools">
            <div class="quick-stats" aria-label="Resumo">
              <span><strong id="statFiles">0</strong> fichas</span>
              <span><strong id="statOps">0</strong> operações</span>
              <span><strong id="statVideos">0</strong> vídeos</span>
            </div>

            <button id="refreshButton" class="icon-button refresh-button" type="button" title="Atualizar fichas" aria-label="Atualizar fichas">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M21 12a9 9 0 0 1-15.5 6.2M3 12A9 9 0 0 1 18.5 5.8M18 2v5h-5M6 22v-5h5" />
              </svg>
            </button>

            <div class="file-search-control">
              <label class="search-box top-search">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="m21 21-4.35-4.35M10.5 18a7.5 7.5 0 1 1 0-15 7.5 7.5 0 0 1 0 15Z" />
                </svg>
                <input id="fileSearch" type="search" placeholder="Buscar ficha técnica..." autocomplete="off" aria-controls="fileResults" aria-expanded="false" />
              </label>
              <div id="fileResults" class="search-results" hidden>
                <div class="search-results-head">
                  <span>Fichas encontradas</span>
                  <span id="fileCount" class="count-pill">0</span>
                </div>
                <div id="fileList" class="file-list" aria-live="polite"></div>
              </div>
            </div>
          </div>
        </header>

        <section id="contentPanel" class="content-panel" hidden>
          <div class="sheet-header">
            <div>
              <p class="overline" id="sheetPath"></p>
              <h1 id="sheetTitle">Ficha técnica</h1>
              <div class="sheet-meta">
                <span id="sheetReference"></span>
                <span id="sheetName"></span>
                <span id="sheetUpdated"></span>
              </div>
            </div>
          </div>

          <div id="techSheet" class="tech-sheet"></div>

          <div id="roteiro" class="flow-toolbar">
            <div>
              <span>Fluxo selecionado</span>
              <strong id="flowName">ROTEIRO DE PRODUÇÃO</strong>
            </div>
            <div class="toolbar-metrics">
              <span><strong id="visibleOps">0</strong> exibidas</span>
              <span><strong id="matchedVideos">0</strong> com vídeo</span>
            </div>
            <label class="search-box operations-search">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="m21 21-4.35-4.35M10.5 18a7.5 7.5 0 1 1 0-15 7.5 7.5 0 0 1 0 15Z" />
              </svg>
              <input id="operationSearch" type="search" placeholder="Buscar no roteiro..." autocomplete="off" />
            </label>
          </div>

          <div class="table-wrap route-table-wrap">
            <table class="route-table">
              <thead>
                <tr>
                  <th class="col-number">#</th>
                  <th class="col-code">Código</th>
                  <th class="col-group">Máquina</th>
                  <th>Descrição da operação</th>
                  <th>Observações</th>
                  <th class="col-time">Tempo</th>
                  <th class="col-video">Vídeo</th>
                </tr>
              </thead>
              <tbody id="operationsBody"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

    <div id="videoModal" class="modal" hidden>
      <div class="modal-backdrop" data-close-modal></div>
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="videoTitle">
        <div class="modal-head">
          <div>
            <p id="videoCode" class="overline"></p>
            <h2 id="videoTitle">Vídeo da operação</h2>
          </div>
          <button class="icon-button" type="button" data-close-modal aria-label="Fechar vídeo">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M18 6 6 18M6 6l12 12" />
            </svg>
          </button>
        </div>
        <video id="videoPlayer" controls autoplay playsinline></video>
        <p id="videoFileName" class="video-file"></p>
      </div>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
